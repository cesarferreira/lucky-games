<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maths Quest — Pick a Game!</title>
<style>
  :root{font-family:ui-rounded,'Arial Rounded MT Bold',Nunito,system-ui,sans-serif;color:#252548;background:#f6f5ff;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}.app{max-width:1040px;margin:0 auto;padding:22px 22px 36px}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:4px solid #faad3d;outline-offset:4px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}.brand{display:flex;align-items:center;gap:12px;font-size:clamp(21px,3vw,30px);font-weight:1000;letter-spacing:-1.1px}.brand-icon{width:49px;height:49px;display:grid;place-items:center;background:#7366ed;color:white;border-radius:16px;box-shadow:0 5px 0 #5549b8;transform:rotate(-5deg)}.tally{background:white;border-radius:100px;padding:10px 16px;box-shadow:0 4px 15px #54418d12;font-size:15px;font-weight:900;white-space:nowrap}.home-title{text-align:center;font-size:clamp(28px,5vw,43px);font-weight:1000;letter-spacing:-1.8px;margin:10px 0 7px}.subtitle{text-align:center;font-size:16px;color:#77758f;margin:0 0 25px;font-weight:650}.table-panel{margin:0 auto 26px;background:white;border:1px solid #ecebf5;border-radius:23px;padding:17px 21px;max-width:820px;text-align:center;box-shadow:0 7px 30px #6350a10a}.panel-label{font-weight:900;font-size:15px;margin-bottom:11px}.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:9px}.chip{padding:9px 15px;border:2px solid #e7e6f5;border-radius:14px;background:#f9f9ff;color:#696580;font-size:15px;font-weight:900;transition:transform .15s}.chip:hover,.game-tile:hover{transform:translateY(-3px)}.chip.active{background:#eae7ff;color:#5848c5;border-color:#8679ed}.game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:900px;margin:auto}.game-tile{border-radius:27px;padding:24px 23px;text-align:left;min-height:205px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s;box-shadow:0 7px 0 rgba(0,0,0,.075);color:#fff}.game-tile::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-60px;top:-80px;background:#ffffff16}.tile-content{position:relative;z-index:1;max-width:230px}.tile-name{font-size:27px;line-height:1.06;letter-spacing:-1px;font-weight:1000;margin:0 0 10px}.tile-desc{font-size:15px;font-weight:700;opacity:.9;line-height:1.4;margin:0 0 19px}.play-pill{display:inline-flex;background:#ffffff;align-items:center;gap:7px;border-radius:30px;padding:9px 15px;color:#4b3d7b;font-weight:1000;font-size:14px}.tile-art{font-size:clamp(57px,9vw,100px);filter:drop-shadow(0 11px 2px #28224f16);transform:rotate(7deg);position:relative;z-index:1;min-width:85px;text-align:center}.bubble-tile{background:linear-gradient(135deg,#8777f5,#5d56d8)}.dino-tile{background:linear-gradient(135deg,#4fbf94,#24a886)}.rocket-tile{background:linear-gradient(135deg,#5c9ded,#4366cf)}.memory-tile{background:linear-gradient(135deg,#f4ac49,#ec7e64)}.back{display:inline-flex;gap:8px;align-items:center;background:#fff;border-radius:15px;padding:10px 15px;color:#645e82;font-size:14px;font-weight:900;box-shadow:0 3px 12px #45427712}.game-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:17px;flex-wrap:wrap}.game-label{font-size:18px;font-weight:1000}.progress-head{display:flex;justify-content:space-between;font-size:14px;font-weight:900;color:#77758f;margin-bottom:9px}.progress-track{height:13px;background:#e7e5f4;border-radius:30px;overflow:hidden;margin-bottom:24px}.progress-fill{height:100%;background:linear-gradient(90deg,#54d5aa,#7d77ee);border-radius:30px;transition:width .4s}.play-area{background:white;border:1px solid #eeecf7;border-radius:32px;padding:26px 24px 30px;box-shadow:0 12px 35px #4c449111;min-height:415px;text-align:center}.prompt-tag{color:#8d86ac;font-size:13px;letter-spacing:1.6px;font-weight:1000;text-transform:uppercase;margin:2px 0 9px}.question{font-size:clamp(34px,7vw,60px);font-weight:1000;letter-spacing:-2px;margin:0 0 14px;color:#333052}.question-small{font-size:clamp(23px,4.3vw,35px);letter-spacing:-1px;line-height:1.2}.hint{font-size:15px;color:#88839c;font-weight:700;margin:0 0 23px}.bubbles{display:flex;justify-content:center;gap:clamp(9px,3vw,22px);flex-wrap:wrap;margin-top:35px}.answer-bubble{width:clamp(90px,16vw,132px);height:clamp(90px,16vw,132px);border-radius:50%;background:radial-gradient(circle at 32% 22%,#fff9 0 8%,transparent 13%),linear-gradient(140deg,#bbabff,#7667e6);border:5px solid #ffffffba;box-shadow:0 9px 0 #5a54ab33,inset 0 -12px 15px #5447a544;color:white;font-size:clamp(28px,5vw,44px);font-weight:1000;transition:transform .16s;animation:float 2.5s ease-in-out infinite}.answer-bubble:nth-child(2){background:radial-gradient(circle at 32% 22%,#fff9 0 8%,transparent 13%),linear-gradient(140deg,#ffca86,#f48b6f);animation-delay:-.6s}.answer-bubble:nth-child(3){background:radial-gradient(circle at 32% 22%,#fff9 0 8%,transparent 13%),linear-gradient(140deg,#8be8db,#39bbae);animation-delay:-1.1s}.answer-bubble:nth-child(4){background:radial-gradient(circle at 32% 22%,#fff9 0 8%,transparent 13%),linear-gradient(140deg,#9ec8fd,#689be5);animation-delay:-1.8s}.answer-bubble:hover,.answer-card:hover{transform:scale(1.075)}.answer-bubble:disabled,.answer-card:disabled{cursor:default;opacity:.8}.answer-bubble:disabled:hover,.answer-card:disabled:hover{transform:none}.answer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;max-width:465px;margin:21px auto 0}.answer-card{border-radius:19px;padding:18px 10px;background:#f2f0ff;color:#564cc6;font-size:clamp(22px,4vw,32px);font-weight:1000;box-shadow:0 5px 0 #d9d4fb;transition:transform .15s}.answer-card:nth-child(2){background:#e7f8f2;color:#1c9b74;box-shadow:0 5px 0 #ccebe0}.answer-card:nth-child(3){background:#fff0db;color:#df8a25;box-shadow:0 5px 0 #f7ddbb}.answer-card:nth-child(4){background:#e8f1ff;color:#5786d1;box-shadow:0 5px 0 #cedeef}.feedback{min-height:37px;margin-top:21px;font-size:21px;font-weight:1000}.feedback.good{color:#159a6c}.feedback.try{color:#da8547}.dino-figure{font-size:78px;line-height:1.1;display:inline-block;animation:dino-idle 2.5s ease-in-out infinite}.dino-figure.happy{animation:happy .65s ease-in-out infinite}.food-groups{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:13px auto 10px;max-width:700px}.food-group{border:2px dashed #abe2c2;border-radius:17px;background:#f1fcf5;padding:9px 10px;min-width:65px}.food-icons{letter-spacing:2px;font-size:23px;line-height:1.45}.group-label{font-size:11px;font-weight:900;color:#54a582}.rocket-scene{height:170px;margin:10px auto 20px;max-width:620px;border-radius:22px;background:linear-gradient(#1e3166,#507bd2);overflow:hidden;position:relative}.starfield{position:absolute;inset:0;background-image:radial-gradient(white 1.6px,transparent 2px);background-size:61px 43px;opacity:.6}.moon{position:absolute;top:12px;right:26px;font-size:43px}.rocket-ship{position:absolute;font-size:70px;left:calc(7% + var(--rocket-progress)* 13%);bottom:13px;transform:rotate(45deg);transition:left .7s ease;filter:drop-shadow(0 5px 5px #0005)}.rocket-path{position:absolute;bottom:20px;left:8%;right:13%;border-bottom:3px dashed #ffffff80}.rocket-question{margin-bottom:5px}.match-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;max-width:545px;margin:22px auto}.match-card{height:100px;border-radius:18px;background:linear-gradient(145deg,#897cf2,#6559ce);border:4px solid #f2efff;box-shadow:0 5px 0 #554ba733;color:#fff;font-weight:1000;font-size:25px;transition:transform .18s,background .18s}.match-card:hover{transform:translateY(-3px)}.match-card.flipped{background:#fff2d8;color:#73572a;border-color:#f5ce8a}.match-card.matched{background:#ddf7e8;color:#258b61;border-color:#a9e2bd;box-shadow:none}.match-card:disabled{cursor:default}.game-win{text-align:center;background:white;border:1px solid #efedf7;border-radius:32px;padding:46px 22px;box-shadow:0 12px 35px #4c449111}.win-art{font-size:90px;animation:happy .8s infinite alternate}.win-title{font-size:clamp(35px,7vw,56px);margin:8px 0;color:#4840a2;font-weight:1000;letter-spacing:-2px}.win-sub{font-size:18px;color:#76718d;font-weight:800}.win-stars{font-size:47px;letter-spacing:6px;margin:20px auto}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:25px}.primary,.secondary{border-radius:17px;padding:15px 22px;font-weight:1000;font-size:16px}.primary{background:#7164e6;color:white;box-shadow:0 5px 0 #5145b6}.secondary{background:#edeaff;color:#584ec0;box-shadow:0 5px 0 #d7d2f6}.footer{text-align:center;color:#9590ac;font-size:13px;margin:24px 0 0;font-weight:800}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes happy{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(9deg) scale(1.08)}}@keyframes dino-idle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(4deg)}}@media(max-width:640px){.app{padding:16px 13px 27px}.game-grid{grid-template-columns:1fr;gap:14px}.game-tile{min-height:149px;padding:19px 22px}.tile-name{font-size:24px}.tile-desc{font-size:13px;margin-bottom:14px}.tile-art{font-size:72px}.play-area{padding:22px 12px;min-height:405px}.match-card{height:83px;font-size:21px}.tally{font-size:13px}.topbar{margin-bottom:20px}.rocket-ship{font-size:55px}.food-icons{font-size:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.table-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:14px 0 10px}.table-actions button{background:#edeaff;color:#584ec0;border-radius:12px;padding:9px 14px;font-size:14px;font-weight:900}.table-status{margin:0;color:#696580;font-size:14px;font-weight:700}.game-tile:disabled{opacity:.55;cursor:default;transform:none}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
(() => {
'use strict';
const el = document.getElementById('app');
const names = {bubble:'Bubble Pop',dino:'Dino Snacks',rocket:'Rocket Race',memory:'Memory Match'};
const icons = {bubble:'🫧',dino:'🦕',rocket:'🚀',memory:'🃏'};
const tables = Array.from({length:12},(_,i)=>i+1);
const storageKey = 'maths-quest.tables';
function loadTables(){
 try{
  const saved=JSON.parse(localStorage.getItem(storageKey));
  if(Array.isArray(saved)){
   const selected=[...new Set(saved.filter(n=>tables.includes(n)))];
   if(saved.length===0||selected.length)return selected;
  }
 }catch{}
 return [1,2,5];
}
function saveTables(){try{localStorage.setItem(storageKey,JSON.stringify(state.tables))}catch{}}
const state = {screen:'home',mode:null,tables:loadTables(),stars:0,earned:0,round:0,total:5,question:null,feedback:'',locked:false,memory:null,token:0};
const random = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const sample = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => {const a=[...arr];for(let i=a.length-1;i>0;i--){let j=random(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const topbar = () => `<div class="topbar"><div class="brand"><span class="brand-icon">✦</span> Maths Quest</div><span class="tally">⭐ ${state.stars} stars</span></div>`;
function renderHome(){
  el.innerHTML = `${topbar()}<h1 class="home-title">What shall we play? 🎮</h1><p class="subtitle">Pick a game, have fun, and become a maths superstar!</p>
  <section class="table-panel"><div class="panel-label">✨ Choose your times tables</div><div class="chips">${tables.map(t=>`<button class="chip ${state.tables.includes(t)?'active':''}" data-table="${t}" aria-pressed="${state.tables.includes(t)}">× ${t}</button>`).join('')}</div><div class="table-actions"><button data-table-action="all">Select all</button><button data-table-action="none">Deselect all</button></div><p class="table-status" id="table-status" role="status">${state.tables.length?`${state.tables.length} selected`:'Choose at least one times table to play.'}</p></section>
  <div class="game-grid">
    ${tile('bubble','Pop the bubbles!','Find the correct answer and pop it.','🫧','bubble-tile')}
    ${tile('dino','Feed the dino!','Count the snacks to feed your pal.','🦕','dino-tile')}
    ${tile('rocket','Rocket to space!','Solve sums to zoom to the moon.','🚀','rocket-tile')}
    ${tile('memory','Memory match!','Flip cards and find maths pairs.','🃏','memory-tile')}
  </div><p class="footer">🌈 No timers. No pressure. Just maths fun!</p>`;
}
function tile(mode,title,desc,emoji,cls){return `<button class="game-tile ${cls}" data-mode="${mode}" ${state.tables.length?'':'disabled'} aria-describedby="table-status"><div class="tile-content"><h2 class="tile-name">${title}</h2><p class="tile-desc">${desc}</p><span class="play-pill">▶ Play now</span></div><span class="tile-art" aria-hidden="true">${emoji}</span></button>`}
function question(){
 const a=sample(state.tables), b=random(1,state.mode==='dino'?4:12),answer=a*b;
 const choices=new Set([answer]);const offsets=shuffle([-6,-5,-4,-3,-2,-1,1,2,3,4,5,6,10,-10]);
 for(const d of offsets){if(choices.size===4)break;if(answer+d>0)choices.add(answer+d)}
 while(choices.size<4)choices.add(random(1,Math.max(12,answer+10)));
 state.question={a,b,answer,choices:shuffle([...choices])};
}
function start(mode){if(!state.tables.length)return;state.token++;state.mode=mode;state.screen='play';state.round=0;state.total=mode==='memory'?3:5;state.earned=0;state.feedback='';state.locked=false;if(mode==='memory'){newMemory()}else{question()}render()}
function newMemory(){
 const pairs=[],used=new Set();let tries=0;
 while(pairs.length<3&&tries++<200){let a=sample(state.tables),b=random(1,12),v=a*b;if(used.has(v))continue;used.add(v);pairs.push({a,b,v})}
 // In case a single selected times table has too few distinct results, expand the multiplier range.
 for(let b=1;pairs.length<3&&b<=12;b++){const a=state.tables[0],v=a*b;if(!used.has(v)){used.add(v);pairs.push({a,b,v})}}
 let cards=[];pairs.forEach((p,i)=>{cards.push({id:`q${i}`,kind:'question',pair:i,label:`${p.a} × ${p.b}`,matched:false});cards.push({id:`a${i}`,kind:'answer',pair:i,label:String(p.v),matched:false})});
 state.memory={cards:shuffle(cards),flipped:[],busy:false};
}
function progress(){const n=state.round;return `<div class="progress-head"><span>⭐ ${state.earned} earned</span><span>${n} / ${state.total} complete</span></div><div class="progress-track"><div class="progress-fill" style="width:${100*n/state.total}%"></div></div>`}
function answers(bubble){return `<div class="${bubble?'bubbles':'answer-grid'}">${state.question.choices.map(v=>`<button class="${bubble?'answer-bubble':'answer-card'}" data-answer="${v}" ${state.locked?'disabled':''}>${v}</button>`).join('')}</div>`}
function feedback(){return `<div class="feedback ${state.feedback==='Brilliant! ⭐'?'good':state.feedback?'try':''}" aria-live="polite">${state.feedback||'&nbsp;'}</div>`}
function playView(){
 const q=state.question;
 let body='';
 if(state.mode==='bubble')body=`<div class="prompt-tag">🫧 Bubble Pop</div><h1 class="question">${q.a} × ${q.b} = ?</h1><p class="hint">Tap the bubble with the right answer!</p>${answers(true)}${feedback()}`;
 if(state.mode==='dino')body=`<div class="prompt-tag">🍎 Dino Snacks</div><div class="dino-figure ${state.locked?'happy':''}">🦕</div><h1 class="question question-small">${q.b} groups of ${q.a} apples</h1><p class="hint">How many apples altogether?</p><div class="food-groups">${Array.from({length:q.b},()=>`<div class="food-group"><div class="food-icons">${'🍎'.repeat(q.a)}</div><div class="group-label">${q.a} apples</div></div>`).join('')}</div>${answers(false)}${feedback()}`;
 if(state.mode==='rocket')body=`<div class="prompt-tag">🚀 Rocket Race</div><div class="rocket-scene"><div class="starfield"></div><div class="moon">🌕</div><div class="rocket-path"></div><div class="rocket-ship" style="left:${7+state.round*13}%">🚀</div></div><h1 class="question rocket-question">${q.a} × ${q.b} = ?</h1><p class="hint">Every right answer gets you closer to the moon!</p>${answers(false)}${feedback()}`;
 if(state.mode==='memory'){
   const m=state.memory;
   body=`<div class="prompt-tag">🃏 Memory Match</div><h1 class="question question-small">Find the matching pairs!</h1><p class="hint">Turn over two cards. Match a sum to its answer.</p><div class="match-grid">${m.cards.map(c=>{const isUp=c.matched||m.flipped.includes(c.id);return `<button class="match-card ${c.matched?'matched':isUp?'flipped':''}" data-card="${c.id}" ${c.matched?'disabled':''} aria-label="${isUp?c.label:'Hidden card'}">${c.matched?'✓ '+c.label:isUp?c.label:'✦'}</button>`}).join('')}</div>${feedback()}`;
 }
 return `${topbar()}<div class="game-heading"><button class="back" data-home="1">← All games</button><div class="game-label">${icons[state.mode]} ${names[state.mode]}</div></div>${progress()}<div class="play-area" tabindex="-1">${body}</div><p class="footer">Every try makes your brain stronger 💪</p>`
}
function renderWin(){el.innerHTML=`${topbar()}<div class="game-win"><div class="win-art">🏆</div><h1 class="win-title">Amazing work!</h1><p class="win-sub">You finished ${names[state.mode]}!</p><div class="win-stars">⭐⭐⭐</div><p class="win-sub">You earned <strong>${state.earned} stars</strong>! Keep shining ✨</p><div class="actions"><button class="primary" data-replay="1">🔄 Play again</button><button class="secondary" data-home="1">🎮 Choose a game</button></div></div>`}
function render(){
 const active=document.activeElement;
 const data=active?.dataset;
 const key=data&&['table','tableAction','answer','card'].find(k=>data[k]);
 const hadFocus=el.contains?.(active);
 if(state.screen==='home')renderHome();else if(state.screen==='win')renderWin();else el.innerHTML=playView();
 if(hadFocus){
  const target=(key&&document.querySelector(`[data-${key==='tableAction'?'table-action':key}="${data[key]}"]:not(:disabled)`))
   ||document.querySelector(state.screen==='win'?'[data-replay]':state.screen==='home'?'[data-table]':'[data-answer]:not(:disabled),[data-card]:not(:disabled)')
   ||document.querySelector('.play-area');
  target?.focus({preventScroll:true});
 }
}
function win(){state.token++;state.screen='win';render()}
function correct(){state.locked=true;state.earned++;state.stars++;state.feedback='Brilliant! ⭐';render();const tk=state.token;setTimeout(()=>{if(tk!==state.token||state.screen!=='play')return;state.round++;if(state.round>=state.total){win()}else{state.feedback='';state.locked=false;question();render()}},850)}
function answer(v){if(state.locked)return;if(v===state.question.answer){correct()}else{state.feedback=sample(['Nice try! Have another go 💛','Not quite — try again! 🌟','You can do it! 💪']);render()}}
function cardClick(id){const m=state.memory;if(m.busy)return;const c=m.cards.find(c=>c.id===id);if(!c||c.matched||m.flipped.includes(id))return;m.flipped.push(id);state.feedback='';render();if(m.flipped.length===2){m.busy=true;const [x,y]=m.flipped.map(k=>m.cards.find(c=>c.id===k));const tk=state.token;if(x.pair===y.pair && x.kind!==y.kind){setTimeout(()=>{if(tk!==state.token)return;x.matched=true;y.matched=true;m.flipped=[];m.busy=false;state.round++;state.earned++;state.stars++;state.feedback='Brilliant! ⭐';if(state.round===state.total)win();else render()},550)}else{state.feedback='Try another pair! 💛';render();setTimeout(()=>{if(tk!==state.token)return;m.flipped=[];m.busy=false;state.feedback='';render()},1050)}}}
el.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.tableAction){state.tables=t.dataset.tableAction==='all'?[...tables]:[];saveTables();render();return}
 if(t.dataset.table){let n=Number(t.dataset.table);if(state.tables.includes(n)){state.tables=state.tables.filter(x=>x!==n)}else{state.tables.push(n)}saveTables();render();return}
 if(t.dataset.mode){start(t.dataset.mode);return}
 if(t.dataset.home){state.token++;state.screen='home';render();return}
 if(t.dataset.replay){start(state.mode);return}
 if(t.dataset.answer){answer(Number(t.dataset.answer));return}
 if(t.dataset.card){cardClick(t.dataset.card);return}
});
render();
})();
</script>
</body>
</html>
